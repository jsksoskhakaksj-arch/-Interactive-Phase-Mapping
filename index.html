<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phase Map</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* ===== STYLES ===== */
:root{--bg:#f2f3f5;--sf:#fff;--bd:#d8dbe1;--tx:#1a1d24;--mu:#6a7280;--ac:#3563e9;--dot:#c5cad3;--ed:#7d8695;--in:#f6f7f9;--sh:0 1px 2px rgba(20,24,32,.06),0 6px 18px rgba(20,24,32,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#121418;--sf:#1c1f26;--bd:#2d323b;--tx:#e7e9ee;--mu:#98a1b0;--ac:#6b8cff;--dot:#2c313a;--ed:#7c8696;--in:#151820;--sh:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#121418;--sf:#1c1f26;--bd:#2d323b;--tx:#e7e9ee;--mu:#98a1b0;--ac:#6b8cff;--dot:#2c313a;--ed:#7c8696;--in:#151820;--sh:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.4 'IBM Plex Sans',system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
#vp{position:fixed;inset:0;touch-action:none;cursor:grab;background-image:radial-gradient(var(--dot) 1px,transparent 1.3px);background-color:var(--bg)}
#vp.pan{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.edge{fill:none;stroke:var(--ed);stroke-width:1.75}
.edge.sel{stroke:var(--ac);stroke-width:2.5}
.hit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:pointer}
.node{position:absolute;width:210px;box-sizing:border-box;background:var(--sf);border:1px solid var(--bd);border-left:4px solid var(--c);border-radius:8px;box-shadow:var(--sh);padding:10px 12px;user-select:none;cursor:default}
.anim .node{transition:left .45s cubic-bezier(.2,.8,.2,1),top .45s cubic-bezier(.2,.8,.2,1)}
.node.sel{outline:2px solid var(--ac);outline-offset:2px}
.node.tgt{outline:2px dashed var(--ac);outline-offset:2px}
.node.new{animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:0}}
body[data-mode=connect] .node{cursor:crosshair}
.cat{font-size:11px;color:var(--mu);margin-bottom:2px}
.ttl{font-weight:600;padding-right:18px;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tags span{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--in);border:1px solid var(--bd);color:var(--mu)}
.desc{margin-top:8px;font-size:12.5px;color:var(--mu);white-space:pre-wrap;overflow-wrap:anywhere}
.chev{position:absolute;right:6px;top:8px;font-size:12px;color:var(--mu);padding:0 4px}
.port{position:absolute;right:-9px;top:50%;margin-top:-6px;width:12px;height:12px;border-radius:50%;background:var(--sf);border:2px solid var(--c);cursor:crosshair;opacity:.3;transition:opacity .15s}
.node:hover .port,.node.sel .port,.node.tgt .port,body[data-mode=connect] .port{opacity:1}
#tb{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);display:flex;gap:2px;padding:4px;background:var(--sf);border:1px solid var(--bd);border-radius:10px;box-shadow:var(--sh);max-width:calc(100vw - 16px);overflow-x:auto;z-index:5}
#tb button{padding:6px 10px;border-radius:6px;white-space:nowrap}
#tb button:hover{background:var(--in)}
#tb button.on{background:var(--ac);color:#fff}
#tb button:disabled{opacity:.35;cursor:default}
.sep{width:1px;background:var(--bd);margin:4px 3px;flex:none}
#panel{position:fixed;right:10px;top:calc(env(safe-area-inset-top,0px) + 64px);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);width:280px;box-sizing:border-box;overflow:auto;background:var(--sf);border:1px solid var(--bd);border-radius:10px;box-shadow:var(--sh);padding:14px;z-index:4}
#panel h3{margin:0 0 12px;font-size:13px;font-weight:600}
.f{display:block;margin-bottom:10px;font-size:12px;color:var(--mu)}
.f input,.f textarea,#panel select{display:block;width:100%;box-sizing:border-box;margin-top:4px;padding:6px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--in);color:var(--tx);font:inherit}
.f textarea{resize:vertical}
.sws{display:flex;gap:6px;margin-bottom:10px}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid var(--sf);box-shadow:0 0 0 1px var(--bd)}
.sw.on{box-shadow:0 0 0 2px var(--tx)}
.row{display:flex;justify-content:space-between;align-items:center;padding:2px 0}
.lnk{color:var(--ac);text-align:left}
.x{color:var(--mu);padding:0 4px}
.sub{font-size:12px;color:var(--mu);margin:12px 0 4px;font-weight:500}
.mu{color:var(--mu);font-size:12px}
.btn{display:inline-block;padding:6px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--in);cursor:pointer}
.btn.danger{color:#d4475a;margin-top:14px}
.chk{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.keys{margin:14px 0 0;padding:0;list-style:none;font-size:12px;color:var(--mu)}
#mm{position:fixed;left:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);width:160px;height:110px;background:var(--sf);border:1px solid var(--bd);border-radius:8px;box-shadow:var(--sh);z-index:4;cursor:pointer}
#box{position:fixed;display:none;border:1px solid var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent);z-index:3;pointer-events:none}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;place-items:center;z-index:9}
#modal.on{display:grid}
.card{width:min(560px,92vw);background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:16px;box-shadow:var(--sh)}
.card h3{margin:0 0 10px;font-size:14px}
.card textarea{width:100%;height:46vh;box-sizing:border-box;font:12px ui-monospace,Menlo,Consolas,monospace;background:var(--in);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:8px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
#toast.on{opacity:1}
@media(max-width:700px){#panel{left:8px;right:8px;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);width:auto;max-height:38vh}#mm{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body data-mode="select">
<div id="vp"><div id="world">
<svg id="edges"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><g id="eg"></g><path id="tmp" class="edge" stroke-dasharray="5 4" marker-end="url(#ar)" style="stroke:var(--ac)"/></svg>
</div></div>
<div id="tb"></div><aside id="panel"></aside><canvas id="mm" width="320" height="220"></canvas><div id="box"></div><div id="toast"></div>
<div id="modal"><div class="card"><h3>Project JSON</h3><textarea id="json" spellcheck="false"></textarea><div class="bar"><button class="btn" id="cp">Copy</button><label class="btn">Load file<input type="file" id="fl" accept=".json,application/json" hidden></label><button class="btn" id="im">Import from text</button><button class="btn" id="cl">Close</button></div></div></div>
<script>
/* ===== STATE + HISTORY + PERSISTENCE ===== */
const $=s=>document.querySelector(s);
const h=(t,p={},...c)=>{const e=document.createElement(t);for(const k in p){if(k==='on')for(const a in p.on)e.addEventListener(a,p.on[a]);else if(k!=='style'&&k in e)e[k]=p[k];else e.setAttribute(k,p[k])}e.append(...c);return e};
const sv=(t,p)=>{const e=document.createElementNS('http://www.w3.org/2000/svg',t);for(const k in p)e.setAttribute(k,p[k]);return e};
const KEY='phase-map-v1',COLORS=['#6b7a90','#3563e9','#1fa38a','#d9a21b','#d9546b','#8a63d2'];
const vp=$('#vp'),world=$('#world'),eg=$('#eg'),tmp=$('#tmp'),mm=$('#mm');
let S,sel=new Set(),selEdge=null,mode='select',uid=1,hist=[],hi=-1,drag=null,mb=null;
const els=new Map(),nid=()=>'n'+Date.now().toString(36)+(uid++);
const byId=id=>S.nodes.find(n=>n.id===id);
const snapv=v=>S.set.snap?Math.round(v/24)*24:v;
const cs=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function setData(o){
  if(!o||!Array.isArray(o.nodes)||!Array.isArray(o.edges))throw new Error('bad');
  const nodes=o.nodes.map(n=>({id:String(n.id),x:+n.x||0,y:+n.y||0,title:String(n.title||''),desc:String(n.desc||''),color:/^#[0-9a-f]{3,8}$/i.test(n.color)?n.color:COLORS[0],cat:String(n.cat||''),tags:Array.isArray(n.tags)?n.tags.map(String):[],open:!!n.open}));
  const ids=new Set(nodes.map(n=>n.id)),seen=new Set();
  const edges=o.edges.filter(e=>ids.has(e.from)&&ids.has(e.to)&&e.from!==e.to&&!seen.has(e.from+'>'+e.to)&&seen.add(e.from+'>'+e.to)).map(e=>({id:String(e.id||nid()),from:e.from,to:e.to,style:['curve','straight','step'].includes(e.style)?e.style:'curve',dash:!!e.dash,arrow:e.arrow!==false}));
  const v=o.view||{};
  S={nodes,edges,view:{x:+v.x||0,y:+v.y||0,k:Math.min(2.5,Math.max(.2,+v.k||1))},set:Object.assign({name:'Untitled project',snap:false,style:'curve',theme:''},o.set)};
}
function sample(){
  const N=[['p1',0,60,'Phase 1: Discovery','Research',1,'Interviews and goals.',['users']],['p2',280,60,'Phase 2: Design','Design',2,'Flows and prototype.',[]],['p3',560,-30,'Phase 3: Build','Delivery',3,'Core features.',['dev']],['p4',560,150,'Phase 4: Pilot','Validation',4,'Small test group.',[]],['p5',840,150,'Phase 5: Feedback','Validation',4,'Collect and triage.',[]],['p6',1120,60,'Phase 6: Launch','Release',5,'Shared by phases 3 and 5.',['go-live']]];
  const E=[['p1','p2'],['p2','p3'],['p2','p4'],['p4','p5'],['p3','p6'],['p5','p6']];
  return{nodes:N.map(a=>({id:a[0],x:a[1],y:a[2],title:a[3],cat:a[4],color:COLORS[a[5]],desc:a[6],tags:a[7]})),edges:E.map((e,i)=>({id:'e'+i,from:e[0],to:e[1]}))};
}
let st;function save(){clearTimeout(st);st=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},250)}
const snap=()=>JSON.stringify({nodes:S.nodes,edges:S.edges});
function commit(){const s=snap();if(hist[hi]===s)return;hist=hist.slice(0,hi+1);hist.push(s);if(hist.length>100)hist.shift();hi=hist.length-1;save();urState()}
function restore(s){const o=JSON.parse(s);S.nodes=o.nodes;S.edges=o.edges;sel=new Set([...sel].filter(byId));if(selEdge&&!S.edges.some(e=>e.id===selEdge))selEdge=null;full();save();urState()}
const undo=()=>{if(hi>0)restore(hist[--hi])},redo=()=>{if(hi<hist.length-1)restore(hist[++hi])};
function urState(){$('[data-id=undo]').disabled=hi<1;$('[data-id=redo]').disabled=hi>=hist.length-1}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1800)}

/* ===== RENDERING ===== */
function fill(el,n){
  el.style.left=n.x+'px';el.style.top=n.y+'px';el.style.setProperty('--c',n.color);el.classList.toggle('sel',sel.has(n.id));
  el.replaceChildren(n.cat?h('div',{class:'cat'},n.cat):'',h('div',{class:'ttl'},n.title||'Untitled'),n.tags.length?h('div',{class:'tags'},...n.tags.map(t=>h('span',{},t))):'',n.open&&n.desc?h('div',{class:'desc'},n.desc):'',n.desc?h('button',{class:'chev',title:n.open?'Hide details':'Show details'},n.open?'▴':'▾'):'',h('div',{class:'port',title:'Drag to connect'}));
}
function drawNodes(){
  for(const[id,el]of els)if(!byId(id)){el.remove();els.delete(id)}
  for(const n of S.nodes){let el=els.get(n.id);if(!el){el=h('div',{class:'node','data-id':n.id});world.append(el);els.set(n.id,el)}fill(el,n)}
}
const place=n=>{const e=els.get(n.id);e.style.left=n.x+'px';e.style.top=n.y+'px'};
function geo(a,b){
  const A=els.get(a.id),B=els.get(b.id),aw=A.offsetWidth,ah=A.offsetHeight,bw=B.offsetWidth,bh=B.offsetHeight,dx=b.x+bw/2-a.x-aw/2,dy=b.y+bh/2-a.y-ah/2;
  if(Math.abs(dx)/(aw+bw)>=Math.abs(dy)/(ah+bh))return{hz:1,s:dx<0?-1:1,p:[dx>0?a.x+aw:a.x,a.y+ah/2],q:[dx>0?b.x:b.x+bw,b.y+bh/2]};
  return{hz:0,s:dy<0?-1:1,p:[a.x+aw/2,dy>0?a.y+ah:a.y],q:[b.x+bw/2,dy>0?b.y:b.y+bh]};
}
function pathD(a,b,st){
  const g=geo(a,b),[p0,p1]=g.p,[q0,q1]=g.q;
  if(st==='straight')return`M${p0} ${p1}L${q0} ${q1}`;
  if(st==='step')return g.hz?`M${p0} ${p1}H${(p0+q0)/2}V${q1}H${q0}`:`M${p0} ${p1}V${(p1+q1)/2}H${q0}V${q1}`;
  const c=Math.max(40,(g.hz?Math.abs(q0-p0):Math.abs(q1-p1))/2)*g.s;
  return g.hz?`M${p0} ${p1}C${p0+c} ${p1} ${q0-c} ${q1} ${q0} ${q1}`:`M${p0} ${p1}C${p0} ${p1+c} ${q0} ${q1-c} ${q0} ${q1}`;
}
function drawEdges(){
  eg.replaceChildren();
  for(const e of S.edges){
    const a=byId(e.from),b=byId(e.to);if(!a||!b||!els.has(a.id)||!els.has(b.id))continue;
    const d=pathD(a,b,e.style),g=sv('g',{'data-eid':e.id});
    g.append(sv('path',{d,class:'hit'}),sv('path',{d,class:'edge'+(e.id===selEdge?' sel':''),'marker-end':e.arrow===false?'none':'url(#ar)','stroke-dasharray':e.dash?'7 5':'none'}));
    eg.append(g);
  }
}
function full(){drawNodes();drawEdges();applyTheme();applyView();panel()}
function updateSel(){els.forEach((el,id)=>el.classList.toggle('sel',sel.has(id)));drawEdges();panel();mini()}
const selectNodes=ids=>{sel=new Set(ids);selEdge=null;updateSel()};
const selectEdge=id=>{sel=new Set();selEdge=id;updateSel()};
const clearSel=()=>{if(sel.size||selEdge)selectNodes([])};

/* ===== VIEW: pan, zoom, fit, minimap ===== */
function applyView(){const v=S.view;world.style.transform=`translate(${v.x}px,${v.y}px) scale(${v.k})`;vp.style.backgroundSize=`${24*v.k}px ${24*v.k}px`;vp.style.backgroundPosition=`${v.x}px ${v.y}px`;mini();save()}
const toWorld=e=>({x:(e.clientX-S.view.x)/S.view.k,y:(e.clientY-S.view.y)/S.view.k});
function zoomAt(f,cx,cy){const v=S.view,k=Math.min(2.5,Math.max(.2,v.k*f)),r=k/v.k;v.x=cx-(cx-v.x)*r;v.y=cy-(cy-v.y)*r;v.k=k;applyView()}
function goView(t){const a={...S.view},t0=performance.now();(function f(now){const p=Math.min(1,(now-t0)/320),e=1-Math.pow(1-p,3);for(const k of['x','y','k'])S.view[k]=a[k]+(t[k]-a[k])*e;applyView();if(p<1)requestAnimationFrame(f)})(t0)}
function fit(list=S.nodes,instant){
  if(!list.length)return;let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  list.forEach(n=>{const e=els.get(n.id);x0=Math.min(x0,n.x);y0=Math.min(y0,n.y);x1=Math.max(x1,n.x+e.offsetWidth);y1=Math.max(y1,n.y+e.offsetHeight)});
  const wide=innerWidth>700,aw=innerWidth-(wide?300:0),ah=wide?innerHeight-90:innerHeight*.55-70;
  const k=Math.min(1.2,Math.max(.2,Math.min((aw-80)/(x1-x0),(ah-40)/(y1-y0))));
  const t={k,x:aw/2-(x0+x1)/2*k,y:(wide?innerHeight/2+30:ah/2+60)-(y0+y1)/2*k};
  if(instant){S.view=t;applyView()}else goView(t);
}
let mr=0;const mini=()=>{if(!mr)mr=requestAnimationFrame(()=>{mr=0;drawMini()})};
function drawMini(){
  const x=mm.getContext('2d'),W=mm.width,H=mm.height,v=S.view;x.clearRect(0,0,W,H);
  const vw=innerWidth/v.k,vh=innerHeight/v.k,vx=-v.x/v.k,vy=-v.y/v.k;let x0=vx,y0=vy,x1=vx+vw,y1=vy+vh;
  S.nodes.forEach(n=>{const e=els.get(n.id);if(!e)return;x0=Math.min(x0,n.x);y0=Math.min(y0,n.y);x1=Math.max(x1,n.x+e.offsetWidth);y1=Math.max(y1,n.y+e.offsetHeight)});
  const s=Math.min((W-12)/(x1-x0),(H-12)/(y1-y0)),ox=(W-(x1-x0)*s)/2-x0*s,oy=(H-(y1-y0)*s)/2-y0*s;mb={s,ox,oy};
  S.nodes.forEach(n=>{const e=els.get(n.id);if(!e)return;x.fillStyle=n.color;x.fillRect(n.x*s+ox,n.y*s+oy,Math.max(3,e.offsetWidth*s),Math.max(2,e.offsetHeight*s))});
  x.strokeStyle=cs('--ac');x.lineWidth=2;x.strokeRect(vx*s+ox,vy*s+oy,vw*s,vh*s);
}
function miniGo(e){if(!mb)return;const r=mm.getBoundingClientRect(),px=(e.clientX-r.left)*mm.width/r.width,py=(e.clientY-r.top)*mm.height/r.height,v=S.view;v.x=innerWidth/2-((px-mb.ox)/mb.s)*v.k;v.y=innerHeight/2-((py-mb.oy)/mb.s)*v.k;applyView()}
mm.addEventListener('pointerdown',e=>{mm.setPointerCapture(e.pointerId);miniGo(e);mm.onpointermove=miniGo});
mm.addEventListener('pointerup',()=>{mm.onpointermove=null});

/* ===== ACTIONS ===== */
function addNode(x,y){
  if(x==null){const v=S.view,j=(S.nodes.length%5)*20;x=((innerWidth-(innerWidth>700?300:0))/2-v.x)/v.k-105+j;y=(innerHeight/2-v.y)/v.k-30+j}
  const n={id:nid(),x:snapv(x),y:snapv(y),title:'New node',desc:'',color:COLORS[1],cat:'',tags:[],open:false};
  S.nodes.push(n);drawNodes();els.get(n.id).classList.add('new');selectNodes([n.id]);commit();
  setTimeout(()=>{const i=$('#panel input');if(i){i.focus();i.select()}},0);
}
function addEdge(a,b){
  if(a===b)return;
  if(S.edges.some(e=>e.from===a&&e.to===b))return toast('Those nodes are already connected');
  const e={id:'e'+nid(),from:a,to:b,style:S.set.style,dash:false,arrow:true};S.edges.push(e);selectEdge(e.id);commit();
}
function del(){
  if(selEdge)S.edges=S.edges.filter(e=>e.id!==selEdge);
  else if(sel.size){S.nodes=S.nodes.filter(n=>!sel.has(n.id));S.edges=S.edges.filter(e=>byId(e.from)&&byId(e.to))}
  else return;
  sel=new Set();selEdge=null;drawNodes();updateSel();commit();
}
function arrange(){
  const N=S.nodes;if(!N.length)return;const r={};N.forEach(n=>r[n.id]=0);
  for(let i=0;i<N.length;i++)S.edges.forEach(e=>{if(r[e.to]<r[e.from]+1&&r[e.from]+1<N.length)r[e.to]=r[e.from]+1});
  const py=n=>{const p=S.edges.filter(e=>e.to===n.id&&r[e.from]<r[n.id]).map(e=>byId(e.from).y);return p.length?p.reduce((a,b)=>a+b)/p.length:0};
  const cols=[];N.forEach(n=>(cols[r[n.id]]=cols[r[n.id]]||[]).push(n));
  cols.forEach((c,ci)=>{if(ci>0)c.sort((a,b)=>py(a)-py(b));let y=-c.reduce((s,n)=>s+els.get(n.id).offsetHeight+40,-40)/2;c.forEach(n=>{n.x=ci*290;n.y=y;y+=els.get(n.id).offsetHeight+40})});
  world.classList.add('anim');N.forEach(place);const t=performance.now();
  (function f(now){drawEdges();mini();if(now-t<520)requestAnimationFrame(f);else world.classList.remove('anim')})(t);
  fit(N);commit();
}
const isDark=()=>S.set.theme?S.set.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
function applyTheme(){S.set.theme?document.documentElement.dataset.theme=S.set.theme:document.documentElement.removeAttribute('data-theme');document.title=S.set.name+' - Phase Map';mini()}
function theme(){S.set.theme=isDark()?'light':'dark';applyTheme();save()}
function setMode(m){mode=m;document.body.dataset.mode=m;document.querySelectorAll('#tb [data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m===m))}

/* ===== DETAILS PANEL ===== */
const chk=(l,v,fn)=>h('label',{class:'chk'},h('input',{type:'checkbox',checked:v,on:{change(e){fn(e.target.checked)}}}),l);
const styleSel=(v,fn)=>{const s=h('select',{on:{change(){fn(s.value)}}},...[['curve','Curved'],['straight','Straight'],['step','Stepped']].map(o=>h('option',{value:o[0],selected:o[0]===v},o[1])));return s};
const fld=(l,i)=>h('label',{class:'f'},l,i);
function panel(){
  const P=$('#panel');P.replaceChildren();const E=selEdge&&S.edges.find(e=>e.id===selEdge);
  if(E){
    const a=byId(E.from),b=byId(E.to);
    P.append(h('h3',{},'Connection'),h('div',{class:'mu'},(a.title||'Untitled')+' → '+(b.title||'Untitled')),h('div',{class:'sub'},'Style'),styleSel(E.style,v=>{E.style=v;drawEdges();commit()}),h('div',{class:'sub'}),chk('Show arrowhead',E.arrow!==false,v=>{E.arrow=v;drawEdges();commit()}),chk('Dashed line',E.dash,v=>{E.dash=v;drawEdges();commit()}),
      h('button',{class:'btn',on:{click(){if(S.edges.some(x=>x.from===E.to&&x.to===E.from))return toast('The reverse connection already exists');[E.from,E.to]=[E.to,E.from];drawEdges();panel();commit()}}},'Reverse direction'),h('div',{},h('button',{class:'btn danger',on:{click:del}},'Delete connection')));
  }else if(sel.size===1){
    const n=byId([...sel][0]),re=()=>{fill(els.get(n.id),n);drawEdges();mini()};
    const ti=h('input',{value:n.title,placeholder:'Title',on:{input(){n.title=ti.value;re()},change:commit}});
    const de=h('textarea',{rows:4,value:n.desc,placeholder:'Optional description',on:{input(){n.desc=de.value;re()},change:commit}});
    const ca=h('input',{value:n.cat,placeholder:'e.g. Research',on:{input(){n.cat=ca.value;re()},change:commit}});
    const tg=h('input',{value:n.tags.join(', '),placeholder:'comma, separated',on:{input(){n.tags=tg.value.split(',').map(t=>t.trim()).filter(Boolean);re()},change:commit}});
    const list=(t,es,k)=>[h('div',{class:'sub'},t+' ('+es.length+')'),...(es.length?es.map(e=>h('div',{class:'row'},h('button',{class:'lnk',on:{click(){selectNodes([e[k]])}}},byId(e[k]).title||'Untitled'),h('button',{class:'x',title:'Remove connection',on:{click(){S.edges=S.edges.filter(x=>x!==e);drawEdges();panel();commit()}}},'✕'))):[h('div',{class:'mu'},'None')])];
    P.append(h('h3',{},'Node'),fld('Title',ti),fld('Description',de),fld('Category or phase',ca),fld('Tags',tg),h('div',{class:'sws'},...COLORS.map(c=>h('button',{class:'sw'+(n.color===c?' on':''),style:'background:'+c,title:c,on:{click(){n.color=c;re();panel();commit()}}}))),
      ...list('Incoming',S.edges.filter(e=>e.to===n.id),'from'),...list('Outgoing',S.edges.filter(e=>e.from===n.id),'to'),h('button',{class:'btn danger',on:{click:del}},'Delete node'));
  }else if(sel.size>1){
    P.append(h('h3',{},sel.size+' nodes selected'),h('div',{class:'sws'},...COLORS.map(c=>h('button',{class:'sw',style:'background:'+c,title:c,on:{click(){sel.forEach(i=>byId(i).color=c);drawNodes();commit()}}}))),h('button',{class:'btn danger',on:{click:del}},'Delete selected'));
  }else{
    const nm=h('input',{value:S.set.name,on:{input(){S.set.name=nm.value;document.title=nm.value+' - Phase Map';save()}}});
    P.append(h('h3',{},'Project'),fld('Name',nm),chk('Snap nodes to grid',S.set.snap,v=>{S.set.snap=v;save()}),h('div',{class:'sub'},'New connection style'),styleSel(S.set.style,v=>{S.set.style=v;save()}),h('div',{class:'sub'}),
      h('div',{class:'mu'},S.nodes.length+' nodes, '+S.edges.length+' connections'),h('div',{class:'sub'}),h('button',{class:'btn',on:{click:openData}},'Export or import JSON'),
      h('ul',{class:'keys'},...['N add node, V select, C connect','Drag a node’s round handle to connect','Double-click the canvas to add a node','Shift-click or Shift-drag to multi-select','A auto-arrange, F fit, T theme','Del delete, Ctrl+Z undo, Ctrl+Shift+Z redo'].map(t=>h('li',{},t))));
  }
}

/* ===== POINTER + KEYBOARD INTERACTION ===== */
vp.addEventListener('pointerdown',e=>{
  if(e.button>0)return;const ne=e.target.closest('.node'),ed=e.target.closest('[data-eid]');
  if(ed)return selectEdge(ed.dataset.eid);
  if(ne){
    const id=ne.dataset.id,n=byId(id);
    if(e.target.closest('.chev')){n.open=!n.open;fill(ne,n);drawEdges();return commit()}
    if(e.target.classList.contains('port')||mode==='connect'){drag={t:'link',from:id};return}
    if(e.shiftKey)sel.has(id)?sel.delete(id):sel.add(id);else if(!sel.has(id))sel=new Set([id]);
    selEdge=null;updateSel();
    drag={t:'nodes',id,sx:e.clientX,sy:e.clientY,o:[...sel].map(i=>{const m=byId(i);return[m,m.x,m.y]}),moved:false};return;
  }
  if(e.shiftKey){drag={t:'box',sx:e.clientX,sy:e.clientY};return}
  drag={t:'pan',sx:e.clientX,sy:e.clientY,ox:S.view.x,oy:S.view.y,moved:false};vp.classList.add('pan');
});
addEventListener('pointermove',e=>{
  if(!drag)return;const v=S.view,mv=Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>3;
  if(drag.t==='pan'){if(mv)drag.moved=true;v.x=drag.ox+e.clientX-drag.sx;v.y=drag.oy+e.clientY-drag.sy;applyView()}
  else if(drag.t==='nodes'){if(mv)drag.moved=true;if(!drag.moved)return;const dx=(e.clientX-drag.sx)/v.k,dy=(e.clientY-drag.sy)/v.k;for(const[n,x,y]of drag.o){n.x=snapv(x+dx);n.y=snapv(y+dy);place(n)}drawEdges();mini()}
  else if(drag.t==='box'){const b=$('#box').style;b.display='block';b.left=Math.min(e.clientX,drag.sx)+'px';b.top=Math.min(e.clientY,drag.sy)+'px';b.width=Math.abs(e.clientX-drag.sx)+'px';b.height=Math.abs(e.clientY-drag.sy)+'px'}
  else if(drag.t==='link'){
    const a=byId(drag.from),A=els.get(a.id),p=[a.x+A.offsetWidth,a.y+A.offsetHeight/2],q=toWorld(e);
    tmp.setAttribute('d',`M${p[0]} ${p[1]}C${p[0]+50} ${p[1]} ${q.x-50} ${q.y} ${q.x} ${q.y}`);
    const t=document.elementFromPoint(e.clientX,e.clientY)?.closest('.node');els.forEach((el,id)=>el.classList.toggle('tgt',el===t&&id!==drag.from));
  }
});
addEventListener('pointerup',e=>{
  if(!drag)return;const d=drag;drag=null;vp.classList.remove('pan');
  if(d.t==='pan'&&!d.moved)clearSel();
  else if(d.t==='nodes'){if(d.moved)commit();else if(!e.shiftKey&&sel.size>1)selectNodes([d.id])}
  else if(d.t==='box'){
    const bx=$('#box'),r=bx.getBoundingClientRect();bx.style.display='none';
    selectNodes([...els].filter(([id,el])=>{const q=el.getBoundingClientRect();return q.left<r.right&&q.right>r.left&&q.top<r.bottom&&q.bottom>r.top}).map(x=>x[0]));
  }else if(d.t==='link'){
    tmp.setAttribute('d','');els.forEach(el=>el.classList.remove('tgt'));
    const t=document.elementFromPoint(e.clientX,e.clientY)?.closest('.node');if(t)addEdge(d.from,t.dataset.id);
  }
});
vp.addEventListener('wheel',e=>{e.preventDefault();zoomAt(Math.exp(-e.deltaY*(e.ctrlKey?.01:.0015)),e.clientX,e.clientY)},{passive:false});
vp.addEventListener('dblclick',e=>{if(e.target.closest('.node,[data-eid]'))return;const p=toWorld(e);addNode(p.x-105,p.y-30)});
addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){if(e.key==='Escape')e.target.blur();return}
  const c=e.ctrlKey||e.metaKey,k=e.key.toLowerCase(),cx=innerWidth/2,cy=innerHeight/2;
  if(c){if(k==='z'){e.preventDefault();e.shiftKey?redo():undo()}else if(k==='y'){e.preventDefault();redo()}else if(k==='a'){e.preventDefault();selectNodes(S.nodes.map(n=>n.id))}return}
  if(k==='delete'||k==='backspace')del();else if(k==='n')addNode();else if(k==='v')setMode('select');else if(k==='c')setMode('connect');else if(k==='a')arrange();else if(k==='f')fit();
  else if(k==='+'||k==='=')zoomAt(1.25,cx,cy);else if(k==='-')zoomAt(.8,cx,cy);else if(k==='t')theme();else if(k==='escape'){clearSel();setMode('select')}
});
addEventListener('resize',mini);

/* ===== TOOLBAR + JSON DIALOG ===== */
[['Add node','Add node (N)',()=>addNode(),'add'],['Select','Select mode (V)',()=>setMode('select'),'sel','select'],['Connect','Connect mode (C)',()=>setMode('connect'),'con','connect'],0,
 ['Arrange','Auto-arrange (A)',arrange,'arr'],['−','Zoom out (-)',()=>zoomAt(.8,innerWidth/2,innerHeight/2),'zo'],['+','Zoom in (+)',()=>zoomAt(1.25,innerWidth/2,innerHeight/2),'zi'],['Fit','Fit to screen (F)',()=>fit(),'fit'],0,
 ['Undo','Undo (Ctrl+Z)',undo,'undo'],['Redo','Redo (Ctrl+Shift+Z)',redo,'redo'],0,['Theme','Light or dark (T)',theme,'th'],['JSON','Export or import JSON',()=>openData(),'js']
].forEach(b=>$('#tb').append(b?h('button',{title:b[1],'data-id':b[3],...(b[4]?{'data-m':b[4]}:{}),on:{click:b[2]}},b[0]):h('div',{class:'sep'})));
function openData(){$('#json').value=JSON.stringify(S,null,1);$('#modal').classList.add('on')}
$('#cl').onclick=()=>$('#modal').classList.remove('on');
$('#cp').onclick=()=>{const t=$('#json');t.select();try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand('copy')}toast('Copied')};
$('#fl').onchange=e=>{const f=e.target.files[0];if(f)f.text().then(t=>{$('#json').value=t})};
$('#im').onclick=()=>{
  try{setData(JSON.parse($('#json').value));sel=new Set();selEdge=null;full();hist=[];hi=-1;commit();fit(S.nodes,1);$('#modal').classList.remove('on');toast('Project imported')}
  catch(e){toast('That JSON isn’t a valid project file')}
};

/* ===== INIT ===== */
try{setData(JSON.parse(localStorage.getItem(KEY)));var had=1}catch(e){setData(sample())}
full();hist=[snap()];hi=0;urState();setMode('select');
if(!had)fit(S.nodes,1);
document.fonts&&document.fonts.ready.then(()=>{drawEdges();mini()});
</script></body></html>
